# LITE build — the full app minus the YOLO-World detector tier.
#
# Drops torch, torchvision, ultralytics and CLIP: ~1.1GB of dependencies
# and ~1.3GB of resident memory become ~350MB and ~290MB peak, which is
# the difference between needing a paid 2GB instance and fitting a free
# 512MB one.
#
# Nothing is stubbed or faked. The subject locator is a three-tier chain
# (see subject_localization.py) and only tier 1 needs torch; the import
# fails, the detector tier is skipped with a logged warning, and requests
# escalate to the Claude VLM tier — which in practice labels subjects
# better than YOLO did ('Golden Gate Bridge' at 0.97 vs a generic class).
#
# What you give up:
#   - Subject localization needs an ANTHROPIC_API_KEY. Without one it
#     falls all the way through to the saliency centroid, which has no
#     bounding box and no label.
#   - One extra Claude call per analysis, so /analyze gets slower and
#     costs more per photo.
#   - No offline/local subject detection at all.
#
# Install:  pip install -r requirements-lite.lock

