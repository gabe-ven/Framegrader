# Fully-pinned resolution of requirements.txt, including every transitive
# dependency. Generated with: pip freeze (test-only packages removed).
#
# WHY THIS EXISTS: requirements.txt pins only direct dependencies, so the
# transitive set was resolved fresh on every install. That is how CI ended
# up on OpenCV 5.0 while dev machines sat on 4.x — same requirements file,
# different result, tests passing locally and failing in CI. Deployments
# and CI should install from THIS file so every environment is identical.
#
#   pip install -r requirements.lock
#
# Regenerate after any change to requirements.txt:
#   pip install -r requirements.txt && pip freeze | grep -viE '^(pytest|pluggy|iniconfig)==' > requirements.lock
#
# Note: version strings are portable, but a few wheels are
# platform-specific. Regenerate on Linux if a macOS-built lock ever
# resolves differently in the container.

