# Render Blueprint for the backend. The frontend deploys to Vercel — see
# vercel.json and the Deployment section of README.md.
#
# NOTE: a Blueprint only configures services CREATED from a Blueprint. A service
# created by hand in the dashboard ignores this file and keeps using its own
# settings — which is why adding it did not fix anything on an existing service.
# Either create the service via New > Blueprint, or set the same values by hand.
#
# No dockerfilePath/dockerContext overrides are needed any more: the Dockerfile
# now sits at the repo root with the root as its build context, which is what
# Render defaults to.
services:
  - type: web
    name: framegrader-api
    runtime: docker
    healthCheckPath: /health
    # Free fits — but only with the lite build below. Measured: ~88 MB idle,
    # ~292 MB peak across three concurrent 26MP analyses, against the 512 MB
    # cap. The full build (with torch) needs ~1.4 GB and would OOM at startup;
    # to deploy that instead, drop the dockerBuildArgs below and move to a
    # 2 GB plan.
    plan: free
    dockerBuildArgs:
      # Drops torch/ultralytics: subject localization escalates to the Claude
      # VLM tier instead of running YOLO locally. Requires ANTHROPIC_API_KEY.
      # See backend/requirements-lite.lock for the full trade-off.
      REQUIREMENTS: requirements-lite.lock
    envVars:
      # Secrets and per-environment values: set these in the Render dashboard.
      # sync: false means "prompt me, don't store it in the repo".
      - key: ANTHROPIC_API_KEY
        sync: false
      # Must list the Vercel origin exactly, e.g. https://framegrader.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false

      # Render terminates TLS at its own proxy and forwards to the container, so
      # X-Forwarded-For is the only way to see the real client address. Without
      # this uvicorn trusts 127.0.0.1 only, every request appears to come from
      # the proxy, and the per-IP rate limiter throttles all users as one.
      # `*` is safe here specifically because the container is not reachable
      # except through that proxy.
      - key: FORWARDED_ALLOW_IPS
        value: "*"

      # One analysis at a time. The default derives from cpu_count, which on a
      # small shared instance would allow more concurrent 26MP decodes than the
      # memory allows.
      - key: ANALYSIS_CONCURRENCY
        value: "1"

      - key: LOG_LEVEL
        value: "INFO"
      # One JSON object per line: Render's log search can then filter on
      # request_id / job_id / stage / duration_ms instead of grepping text.
      - key: LOG_FORMAT
        value: "json"

      # Background jobs run inside this process (the free plan has no
      # background workers). One thread: each running job holds a decoded photo.
      - key: EMBEDDED_WORKERS
        value: "1"
      # Signs image URLs for private analyses. Generated once by Render and
      # stable across deploys, so links handed out before a deploy keep working.
      - key: SECRET_KEY
        generateValue: true
      # Optional but recommended: without it, history and share links live in
      # SQLite on the instance's ephemeral disk and are wiped on every deploy.
      # Paste a Postgres connection string (Render Postgres, Neon, Supabase…);
      # postgres:// URLs are accepted as-is.
      - key: DATABASE_URL
        sync: false
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: AI_RATE_LIMIT
        value: "10/hour"
      - key: ANALYZE_RATE_LIMIT
        value: "60/hour"
