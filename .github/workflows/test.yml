name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend tests (full build, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      # Installs the LOCK, not requirements.txt. Resolving transitively on each
      # run is what silently moved CI to OpenCV 5.0 the day it shipped, breaking
      # leading-line detection here while dev machines stayed green on 4.x.
      # Heavy (torch/ultralytics), but the pip cache keeps repeat runs fast.
      # Tests degrade gracefully without model weights or an ANTHROPIC_API_KEY
      # (VLM/detector paths are mocked or fall back).
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.lock
          pip install pytest

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -q

      # The benchmark's own machinery (metrics, calibration fit, manifest
      # pinning, the range-request zip reader). Offline: no datasets needed.
      - name: Run benchmark unit tests
        working-directory: eval
        run: python -m pytest tests/ -q

  backend-postgres:
    # The job queue claims work with FOR UPDATE SKIP LOCKED on Postgres and a
    # different code path on SQLite. Production may run either, so both run
    # here. The lite lock keeps this job fast: the suite needs no torch.
    name: backend tests (lite build, Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: framegrader
          POSTGRES_PASSWORD: framegrader
          POSTGRES_DB: framegrader_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U framegrader"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://framegrader:framegrader@localhost:5432/framegrader_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-lite.lock
      - name: Install dependencies
        run: |
          pip install -r backend/requirements-lite.lock
          pip install pytest
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests/ -q

  frontend:
    name: frontend lint, type-check, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-lite.lock

      # The lite build: what the free deployment runs, and no torch to install.
      - name: Install backend
        run: pip install -r backend/requirements-lite.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        env:
          E2E_PYTHON: python
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
